# @jumo generated
# @jumo hash=0000000000000000

[package]
name = "wist-gwlinkd"
version = "0.5.1" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
description = "Host-side resident keeping a wist gateway stack linked to WistCenter (register / heartbeat / upgrade)"
repository = "https://github.com/dayu-sec/wist-gwlinkd"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
ring = "0.17"
tokio = { version = "1.48", features = ["full"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "webpki-roots"] }
wist-control = { version = "0.8" }
# gateway↔center 注册/凭据契约（客户端证书 mTLS）。

# 客户端密钥对 + CSR（私钥永不出本机）；x509-parser 读自家证书序列号（轮换时提交）。
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = "0.16"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wist-gwlinkd"
path = "src/main.rs"
